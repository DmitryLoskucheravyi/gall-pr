name: CI

# Both halves of the shop, on every push and every pull request. Nothing here
# deploys: the web app is built by Cloudflare Pages from the same commit, and
# this is only the gate that says the commit is worth building.
on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first run pointless — stop it and
# keep the minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The build needs the public variables at build time — they are inlined
      # into the client bundle, and next.config.ts reads the API origin to
      # write the CSP. Placeholders, because nothing here talks to the real
      # API: the point is that the build succeeds and the output is sane.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          API_URL: https://api.example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: example_bot

  backend:
    name: backend — lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm install, not npm ci: the lock file was generated on Windows and
      # npm ci fails against it inside a Linux image — see the note in
      # backend/Dockerfile and section 4.1 of docs/outstanding.md. Switch this
      # to `npm ci` the day that lock file is regenerated in a Linux container.
      - run: npm install

      # lint:check rather than lint: the repo's own `lint` script carries
      # --fix, and a CI job that rewrites files is one that passes on a tree
      # nobody has.
      - run: npm run lint:check

      # The 53 unit tests. The e2e suite is not run here: it needs a database,
      # and pointing CI at the live TiDB is not a trade worth making.
      - run: npm test

      - run: npm run build
