<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Viktorumm — галерея сучасного українського живопису</title>
    <meta
      name="description"
      content="Кураторська добірка оригінальних картин від українських художників. Кожна робота — в єдиному екземплярі. Доставка Новою поштою по всій Україні."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Viktorumm" />
    <meta
      property="og:title"
      content="Viktorumm — галерея сучасного українського живопису"
    />
    <meta
      property="og:description"
      content="Кураторська добірка оригінальних картин від українських художників. Кожна робота — в єдиному екземплярі."
    />
    <meta property="og:locale" content="uk_UA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Viktorumm — галерея сучасного українського живопису"
    />
    <meta
      name="twitter:description"
      content="Кураторська добірка оригінальних картин від українських художників."
    />

    <script>
      (function () {
        var stored = localStorage.getItem('gall_theme');
        var isDark = stored
          ? stored === 'dark'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
